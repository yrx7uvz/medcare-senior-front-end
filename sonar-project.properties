# Análise do app no SonarQube (passo a passo em docs/qualidade.md). O token NUNCA fica aqui: vai na linha de comando
# ou na variável SONAR_TOKEN.
sonar.projectKey=medcare-senior-mobile
sonar.projectName=MedCare Sênior - app
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,app.config.ts,index.ts
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da análise inteira: só o que não é código do app (dependências e saídas geradas)
sonar.exclusions=node_modules/**,coverage/**,dist/**,dist-check/**,android/**,ios/**,assets/**

# Fora só do cálculo de COBERTURA (bugs, vulnerabilidades e code smells continuam analisados nelas):
# - telas e componentes visuais (src/features/**/*.tsx, src/components/**, src/app/**): verificados pelo plano de testes
#   manuais, pelo check:a11y e pelo smoke, não por teste de unidade;
# - dados fictícios do modo demonstração (src/mocks/**) e tokens de tema (src/theme/**): sem lógica a cobrir;
# - scripts de verificação (scripts/**): são eles próprios testes e ferramentas.
# A cobertura medida é a das regras, dos mapeadores e dos adaptadores HTTP (collectCoverageFrom do jest.config.js).
sonar.coverage.exclusions=src/features/**/*.tsx,src/components/**,src/app/**,src/mocks/**,src/theme/**,scripts/**,app.config.ts,index.ts
